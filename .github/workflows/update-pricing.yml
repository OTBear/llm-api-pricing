name: Update LLM pricing

on:
  schedule:
    - cron: "17 4 * * *" # daily at 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run pricing scraper
        run: python pricing_scraper.py

      - name: Update price history
        run: python update_history.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llm_pricing.json google.json openai.json anthropic.json openrouter.json history
          git diff --cached --quiet || git commit -m "Update LLM pricing data"
          git push
